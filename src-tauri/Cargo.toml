[package]
name = "mad-installer"
version = "1.0.1"
description = "mad installer"
authors = ["yar2slav"]
license = "MIT"
edition = "2024"

[lib]
name = "mad_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idevice = { version = "0.1.68", default-features = false, features = ["usbmuxd", "ring", "pair", "afc", "installation_proxy"] }
isideload = { version = "0.5.2" }
apple-codesign-quick = "0.1.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
futures = "0.3"
futures-util = "0.3"
plist = "1.8"
rootcause = "0.12"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.3", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
